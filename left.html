
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 25px 15px;
            background: linear-gradient(180deg, #f8f9fa 0%, #e8eaed 100%);
            min-height: 100vh;
        }

        h2 {
            color: #ff237f;
            font-size: 20px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid #ff237f;
            font-weight: 700;
        }

        ul {
            list-style: none;
        }

        li {
            margin: 8px 0;
        }

        a {
            color: #333;
            text-decoration: none;
            font-weight: 600;
            display: block;
            padding: 12px 15px;
            border-radius: 6px;
            transition: all 0.3s ease;
            background: white;
            margin-bottom: 10px;
            box-shadow: 0 2px 4px rgba(255, 35, 127, 0.1);
        }

        a:hover {
            background: linear-gradient(135deg, #ff237f 0%, #d81b60 100%);
            color: white;
            transform: translateX(5px);
            box-shadow: 0 4px 8px rgba(255, 35, 127, 0.3);
        }
    </style>
</head>

    </ul>
</body>
</html>
