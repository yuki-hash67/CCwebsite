<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Header</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px 30px;
            background: linear-gradient(135deg, #ff237f 0%, #d81b60 100%);
            color: white;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.3px;
            opacity: 0.95;
        }
    </style>
</head>
<body>
    <h1> City College of San Jose del Monte</h1>
    <p>Welcome to our official college page | Empowering Excellence in Education</p>
</body>
</html>
